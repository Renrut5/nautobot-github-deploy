---
name: "Generate Release"
on:
  release:
    types: [published]

env:
  CODE_REPOSITORY: "Renrut5/nautobot-github-deploy"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"
  PYTHON_VER: 3.12.3

jobs:
  validate-poetry:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Set Nautobot Version"
        run: | 
          NAUTOBOT_VERSION=$(python3 scripts/get_nautobot_version.py)
          echo "NAUTOBOT_VERSION=$NAUTOBOT_VERSION" >> "$GITHUB_ENV"



  build_and_publish_image:
    runs-on: "ubuntu-latest"
    needs:
      - "validate-poetry"

    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: Check out code
        uses: "actions/checkout@v4"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      - name: "Log in to GitHub Container Registry"
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Generate image tags and labels"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: "Build and push image"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            NAUTOBOT_VERSION=${{ needs.validate-poetry.outputs.nautobot_version }}
            PYTHON_VER=${{ env.PYTHON_VER }}
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
