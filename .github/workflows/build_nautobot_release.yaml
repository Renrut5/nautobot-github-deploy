---
name: "Generate Release"
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: "publish-image"
  cancel-in-progress: false

env:
  # Base Nautobot Image Information
  PYTHON_VERSION: "${{ vars.PYTHON_VERSION || '3.12' }}"

  # Output Image Info
  PUBLISHED_IMAGE_REGISTRY: "ghcr.io"
  PUBLISHED_IMAGE_NAME: "${{ vars.PUBLISHED_IMAGE_NAME || github.repository }}"

jobs:
  build_and_publish_image:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: Check out code
        uses: "actions/checkout@v4"

      - name: "Set Nautobot version from pyproject.toml"
        run: |
          NAUTOBOT_VER=$(python3 scripts/get_nautobot_version.py)
          echo "NAUTOBOT_VER=$NAUTOBOT_VER" >> "$GITHUB_ENV"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Log in to GitHub Container Registry"
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.PUBLISHED_IMAGE_REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Generate image tags and labels"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "${{ env.PUBLISHED_IMAGE_REGISTRY }}/${{ env.PUBLISHED_IMAGE_NAME }}"
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: "Build and push image"
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          build-args: |
            NAUTOBOT_VER=${{ env.NAUTOBOT_VER }}
            PYTHON_VER=${{ env.PYTHON_VERSION }}
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
