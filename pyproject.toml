[project]
name = "nautobot-github-deploy"
version = "0.0.1"
description = "GitHub repo for building Nautobot images and deploying to Kubernetes using Helm charts."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.10,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
nautobot = "3.2.7"

################################
# Add Custom Dependencies Here #
################################
# nautobot-app-ssot = "*"


########################################
# Local apps in the plugins/ directory #
########################################
example-app = { path = "plugins/example_app-1.0.0-py3-none-any.whl" }


[dependency-groups]
dev = [
    "invoke (>=3.0.3,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
